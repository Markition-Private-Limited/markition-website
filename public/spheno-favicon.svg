<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 190" fill="none">
  <defs>
    <linearGradient id="favGyro1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F2E" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="favGyro2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <radialGradient id="favOrb" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="30%" stop-color="#C4B5FD" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </radialGradient>
  </defs>

  <g transform="translate(3, 5)">
    <!-- Thin Orbital Rings -->
    <ellipse cx="92" cy="90" rx="86" ry="74" stroke="#818CF8" stroke-width="2" opacity="0.75" transform="rotate(-26 92 90)" fill="none" />
    <circle cx="16" cy="80" r="5" fill="url(#favOrb)" />
    <circle cx="166" cy="102" r="4" fill="url(#favOrb)" />
    <circle cx="108" cy="18" r="4.5" fill="url(#favOrb)" />

    <ellipse cx="92" cy="90" rx="84" ry="62" stroke="#A78BFA" stroke-width="1.8" opacity="0.6" transform="rotate(36 92 90)" fill="none" />
    <circle cx="56" cy="14" r="5.5" fill="url(#favOrb)" />
    <circle cx="130" cy="166" r="4" fill="url(#favOrb)" />
    <circle cx="162" cy="62" r="4.5" fill="url(#favOrb)" />

    <!-- Dark Navy Inner Shading -->
    <path d="M 68 50 C 90 32 125 38 140 68 C 148 85 142 108 126 126 C 110 144 85 152 64 142 C 48 134 40 115 46 95 C 50 82 58 65 68 50 Z" fill="url(#favShadow)" />

    <!-- Outer Gyroscope Ribbon -->
    <path d="M 44 88 C 42 54 62 30 92 24 C 124 18 150 36 156 64 C 160 84 150 108 132 126 C 116 142 96 152 74 152 C 54 152 42 140 44 120 C 46 106 58 92 76 80 C 60 82 46 84 44 88 Z" fill="url(#favGyro1)" />

    <!-- Front Gyroscope Loop -->
    <path d="M 94 32 C 72 38 56 60 52 86 C 48 114 64 140 92 146 C 118 152 142 136 146 110 C 150 84 136 58 110 42 C 104 38 98 34 94 32 Z" fill="none" stroke="url(#favGyro2)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Specular Highlight -->
    <path d="M 52 80 C 50 60 62 40 84 32 C 104 24 126 28 140 44" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75" stroke-linecap="round" />
    <path d="M 72 144 C 94 150 118 144 134 128 C 146 116 152 98 148 82" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.85" stroke-linecap="round" />

    <!-- Central Glowing Orb -->
    <circle cx="92" cy="90" r="17" fill="url(#favOrb)" />
    <circle cx="87" cy="85" r="4.5" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
