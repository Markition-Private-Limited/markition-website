<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgVoiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050827" />
      <stop offset="50%" stop-color="#080D35" />
      <stop offset="100%" stop-color="#03061A" />
    </linearGradient>
    <linearGradient id="cardVoiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A123C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050926" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="waveCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0018C5" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="voiceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="500" rx="24" fill="url(#bgVoiceGrad)" stroke="#1F2A66" stroke-width="1.5" />
  <circle cx="400" cy="180" r="180" fill="#00F2FE" opacity="0.08" filter="url(#voiceGlow)" />

  <!-- Voice Console Window -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="url(#cardVoiceGrad)" stroke="#1E2A68" stroke-width="1.2" />

    <!-- Top Status Header -->
    <rect width="680" height="54" rx="16" fill="#0D1648" />
    <rect y="42" width="680" height="12" fill="#0D1648" />
    <line x1="0" y1="54" x2="680" y2="54" stroke="#1A255C" stroke-width="1" />

    <g transform="translate(25, 20)">
      <circle cx="6" cy="7" r="5" fill="#10B981" />
      <text x="18" y="11" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Spheno PSTN Inbound Telephony</text>
      <text x="250" y="11" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Latency: 380ms · Sub-Second Voice AI</text>
    </g>

    <!-- Caller Pill Right -->
    <g transform="translate(520, 16)">
      <rect width="135" height="24" rx="12" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-opacity="0.4" />
      <text x="14" y="16" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">● CALL ACTIVE 01:24</text>
    </g>

    <!-- Center Waveform Audio Visualizer -->
    <g transform="translate(60, 85)">
      <rect width="560" height="110" rx="12" fill="#060C2C" stroke="#192866" stroke-width="1" />
      
      <!-- Audio wave bars -->
      <g transform="translate(40, 55)">
        <!-- Bar wave stream -->
        <rect x="0" y="-12" width="4" height="24" rx="2" fill="#0070F3" />
        <rect x="12" y="-22" width="4" height="44" rx="2" fill="#00F2FE" />
        <rect x="24" y="-35" width="4" height="70" rx="2" fill="#00F2FE" />
        <rect x="36" y="-18" width="4" height="36" rx="2" fill="#38BDF8" />
        <rect x="48" y="-8" width="4" height="16" rx="2" fill="#0070F3" />
        <rect x="60" y="-28" width="4" height="56" rx="2" fill="#00F2FE" />
        <rect x="72" y="-40" width="4" height="80" rx="2" fill="#00F2FE" />
        <rect x="84" y="-26" width="4" height="52" rx="2" fill="#38BDF8" />
        <rect x="96" y="-14" width="4" height="28" rx="2" fill="#0070F3" />
        <rect x="108" y="-32" width="4" height="64" rx="2" fill="#00F2FE" />
        <rect x="120" y="-45" width="4" height="90" rx="2" fill="#00F2FE" />
        <rect x="132" y="-22" width="4" height="44" rx="2" fill="#38BDF8" />
        <rect x="144" y="-10" width="4" height="20" rx="2" fill="#0070F3" />
        <rect x="156" y="-38" width="4" height="76" rx="2" fill="#00F2FE" />
        <rect x="168" y="-48" width="4" height="96" rx="2" fill="#00F2FE" />
        <rect x="180" y="-24" width="4" height="48" rx="2" fill="#38BDF8" />
        <rect x="192" y="-12" width="4" height="24" rx="2" fill="#0070F3" />
        <rect x="204" y="-30" width="4" height="60" rx="2" fill="#00F2FE" />
        <rect x="216" y="-42" width="4" height="84" rx="2" fill="#00F2FE" />
        <rect x="228" y="-20" width="4" height="40" rx="2" fill="#38BDF8" />
        <rect x="240" y="-8" width="4" height="16" rx="2" fill="#0070F3" />
        <rect x="252" y="-34" width="4" height="68" rx="2" fill="#00F2FE" />
        <rect x="264" y="-46" width="4" height="92" rx="2" fill="#00F2FE" />
        <rect x="276" y="-25" width="4" height="50" rx="2" fill="#38BDF8" />
        <rect x="288" y="-15" width="4" height="30" rx="2" fill="#0070F3" />
        <rect x="300" y="-36" width="4" height="72" rx="2" fill="#00F2FE" />
        <rect x="312" y="-44" width="4" height="88" rx="2" fill="#00F2FE" />
        <rect x="324" y="-22" width="4" height="44" rx="2" fill="#38BDF8" />
        <rect x="336" y="-10" width="4" height="20" rx="2" fill="#0070F3" />
        <rect x="348" y="-28" width="4" height="56" rx="2" fill="#00F2FE" />
        <rect x="360" y="-40" width="4" height="80" rx="2" fill="#00F2FE" />
        <rect x="372" y="-18" width="4" height="36" rx="2" fill="#38BDF8" />
        <rect x="384" y="-8" width="4" height="16" rx="2" fill="#0070F3" />
        <rect x="396" y="-32" width="4" height="64" rx="2" fill="#00F2FE" />
        <rect x="408" y="-42" width="4" height="84" rx="2" fill="#00F2FE" />
        <rect x="420" y="-20" width="4" height="40" rx="2" fill="#38BDF8" />
        <rect x="432" y="-12" width="4" height="24" rx="2" fill="#0070F3" />
        <rect x="444" y="-26" width="4" height="52" rx="2" fill="#00F2FE" />
        <rect x="456" y="-35" width="4" height="70" rx="2" fill="#00F2FE" />
        <rect x="468" y="-15" width="4" height="30" rx="2" fill="#38BDF8" />
      </g>
    </g>

    <!-- Live Transcript Box -->
    <g transform="translate(60, 215)">
      <!-- Turn 1 -->
      <rect width="560" height="70" rx="10" fill="#0B1542" stroke="#1D2E73" stroke-width="1" />
      <text x="16" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">INBOUND CALLER (Marcus Vance):</text>
      <text x="16" y="44" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">"I have severe tooth pain and need an emergency consultation tomorrow."</text>
      
      <!-- Turn 2 (AI Action) -->
      <g transform="translate(0, 80)">
        <rect width="560" height="85" rx="10" fill="#06123D" stroke="#00F2FE" stroke-width="1.2" />
        <text x="16" y="24" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SPHENO VOICE AI (Speech Synthesis):</text>
        <text x="16" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">"I can lock that in for you right now at 3:15 PM with Dr. Bennett."</text>
        <rect x="16" y="54" width="220" height="20" rx="4" fill="#10B981" fill-opacity="0.2" />
        <text x="24" y="68" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">✓ Calendar Locked · SMS Dispatched</text>
      </g>
    </g>

  </g>
</svg>
