<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="botBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040722" />
      <stop offset="50%" stop-color="#070D33" />
      <stop offset="100%" stop-color="#020414" />
    </linearGradient>

    <!-- Face and Head Shading Gradients -->
    <radialGradient id="faceBaseGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D8E8FF" />
      <stop offset="35%" stop-color="#8BB4F8" />
      <stop offset="65%" stop-color="#3B6CD4" />
      <stop offset="85%" stop-color="#142C85" />
      <stop offset="100%" stop-color="#081448" />
    </radialGradient>

    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A66CC" />
      <stop offset="40%" stop-color="#1E388A" />
      <stop offset="80%" stop-color="#0D1E5E" />
      <stop offset="100%" stop-color="#050C2B" />
    </linearGradient>

    <radialGradient id="eyeIrisGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F2FE" />
      <stop offset="80%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#041238" />
    </radialGradient>

    <radialGradient id="cyberGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0070F3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0018C5" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="520" rx="24" fill="url(#botBgGrad)" stroke="#1F2A66" stroke-width="1.5" />

  <!-- Ambient Holographic Backlight Bloom -->
  <circle cx="400" cy="270" r="230" fill="url(#cyberGlowGrad)" />
  <circle cx="680" cy="90" r="140" fill="#0018C5" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Holographic Concentric Sound Wave Rings Behind Avatar -->
  <g opacity="0.35">
    <ellipse cx="400" cy="280" rx="260" ry="190" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4,8" />
    <ellipse cx="400" cy="280" rx="220" ry="160" fill="none" stroke="#0070F3" stroke-width="1" stroke-dasharray="6,6" />
    <ellipse cx="400" cy="280" rx="180" ry="130" fill="none" stroke="#00F2FE" stroke-width="1" />
  </g>

  <!-- ========================================================= -->
  <!-- 3D CYBERNETIC AI BOT AVATAR (HUMANOID SCULPTED HEAD)      -->
  <!-- Matching Reference Image 1 in Spheno Electric Cyan/Sapphire-->
  <!-- ========================================================= -->
  <g id="avatarBust" transform="translate(400, 290)">
    
    <!-- Shoulders & Upper Chest Base -->
    <path d="M -170 230 C -150 140 -80 120 -50 90 L 50 90 C 80 120 150 140 170 230 Z" fill="url(#neckGrad)" />

    <!-- Fiber Neural Lines on Shoulders -->
    <g stroke="#00F2FE" stroke-width="0.8" opacity="0.6">
      <path d="M -150 230 C -130 160 -75 140 -40 100" fill="none" />
      <path d="M -125 230 C -105 170 -65 145 -30 105" fill="none" />
      <path d="M -100 230 C -80 180 -50 150 -20 110" fill="none" />
      <path d="M 150 230 C 130 160 75 140 40 100" fill="none" />
      <path d="M 125 230 C 105 170 65 145 30 105" fill="none" />
      <path d="M 100 230 C 80 180 50 150 20 110" fill="none" />
    </g>

    <!-- Neck Structure -->
    <path d="M -46 30 C -45 65 -48 100 -50 115 L 50 115 C 48 100 45 65 46 30 Z" fill="url(#neckGrad)" />
    
    <!-- Neck Synthetic Fiber Strands (Exact texture as Image 1) -->
    <g stroke="#38BDF8" stroke-width="0.75" opacity="0.7">
      <path d="M -38 35 C -35 65 -36 95 -38 115" fill="none" />
      <path d="M -26 40 C -24 68 -24 95 -26 115" fill="none" />
      <path d="M -14 45 C -12 70 -12 95 -14 115" fill="none" />
      <path d="M 0 45 L 0 115" fill="none" />
      <path d="M 14 45 C 12 70 12 95 14 115" fill="none" />
      <path d="M 26 40 C 24 68 24 95 26 115" fill="none" />
      <path d="M 38 35 C 35 65 36 95 38 115" fill="none" />
    </g>

    <!-- Head & Skull Outer Contour -->
    <path d="M 0 -185 
             C 85 -185 105 -130 105 -60 
             C 105 10 75 60 48 85 
             C 32 100 18 106 0 107 
             C -18 106 -32 100 -48 85 
             C -75 60 -105 10 -105 -60 
             C -105 -130 -85 -185 0 -185 Z" 
          fill="url(#faceBaseGrad)" 
          stroke="#00F2FE" 
          stroke-width="1.2" 
          stroke-opacity="0.4" />

    <!-- Forehead & Skull Rim Light Contour -->
    <path d="M -80 -120 C -55 -175 0 -182 50 -165 C 80 -140 95 -90 98 -40" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />

    <!-- Left Brow & Eye Orbit -->
    <g transform="translate(-40, -42)">
      <!-- Eyebrow -->
      <path d="M -22 -14 C -10 -22 14 -20 25 -14" fill="none" stroke="#1D3E9E" stroke-width="2.5" stroke-linecap="round" />
      <!-- Eye Sclera -->
      <path d="M -25 -2 C -12 -12 12 -12 25 -2 C 12 8 -12 8 -25 -2 Z" fill="#E8F2FF" />
      <!-- Iris -->
      <circle cx="0" cy="-2" r="10" fill="url(#eyeIrisGrad)" />
      <!-- Pupil -->
      <circle cx="0" cy="-2" r="4.5" fill="#030822" />
      <!-- Eye Specular Glint -->
      <circle cx="-3" cy="-4.5" r="2" fill="#FFFFFF" />
      <!-- Cybernetic HUD Ring inside eye -->
      <circle cx="0" cy="-2" r="8" fill="none" stroke="#00F2FE" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.9" />
    </g>

    <!-- Right Brow & Eye Orbit -->
    <g transform="translate(40, -42)">
      <!-- Eyebrow -->
      <path d="M -25 -14 C -14 -20 10 -22 22 -14" fill="none" stroke="#1D3E9E" stroke-width="2.5" stroke-linecap="round" />
      <!-- Eye Sclera -->
      <path d="M -25 -2 C -12 -12 12 -12 25 -2 C 12 8 -12 8 -25 -2 Z" fill="#E8F2FF" />
      <!-- Iris -->
      <circle cx="0" cy="-2" r="10" fill="url(#eyeIrisGrad)" />
      <!-- Pupil -->
      <circle cx="0" cy="-2" r="4.5" fill="#030822" />
      <!-- Eye Specular Glint -->
      <circle cx="-3" cy="-4.5" r="2" fill="#FFFFFF" />
      <!-- Cybernetic HUD Ring inside eye -->
      <circle cx="0" cy="-2" r="8" fill="none" stroke="#00F2FE" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.9" />
    </g>

    <!-- Sculpted Nose -->
    <path d="M 0 -38 L -4 10 L 0 16 L 4 10 Z" fill="#6A97E8" opacity="0.7" />
    <path d="M -8 16 C -4 18 4 18 8 16" fill="none" stroke="#1D3E9E" stroke-width="1.8" stroke-linecap="round" />

    <!-- Sculpted Cyber Lips -->
    <g transform="translate(0, 48)">
      <!-- Upper lip -->
      <path d="M -18 0 C -10 -4 0 -2 0 -2 C 0 -2 10 -4 18 0 C 10 4 0 5 0 5 C 0 5 -10 4 -18 0 Z" fill="#2E52B8" />
      <!-- Lower lip highlight -->
      <path d="M -14 4 C -6 10 6 10 14 4 C 6 6 -6 6 -14 4 Z" fill="#6D99F2" />
      <!-- Center subtle line -->
      <line x1="-16" y1="1" x2="16" y2="1" stroke="#0D1F5C" stroke-width="1" />
    </g>

    <!-- Jawline & Chin Definition -->
    <path d="M -40 85 C -20 102 20 102 40 85" fill="none" stroke="#5E8CE8" stroke-width="1.5" opacity="0.6" />

    <!-- Delicate Micro Cybernetic Seams on Temple -->
    <path d="M -75 -60 L -60 -45 L -60 -20" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.7" />
    <circle cx="-60" cy="-20" r="1.5" fill="#00F2FE" />
    
    <path d="M 75 -60 L 60 -45 L 60 -20" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.7" />
    <circle cx="60" cy="-20" r="1.5" fill="#00F2FE" />
  </g>

  <!-- ========================================================= -->
  <!-- FLOATING INTERACTIVE QUESTION BADGE (MATCHING IMAGE 1)    -->
  <!-- "What is a SpeechBot?" style badge                        -->
  <!-- ========================================================= -->
  <g transform="translate(520, 40)">
    <rect width="230" height="48" rx="24" fill="#091338" stroke="#00F2FE" stroke-width="1.2" filter="url(#neonGlow)" />
    
    <!-- User Avatar Circle -->
    <circle cx="24" cy="24" r="15" fill="#0018C5" />
    <!-- User Icon/Head -->
    <circle cx="24" cy="20" r="6" fill="#FFFFFF" />
    <path d="M 14 32 C 14 26 34 26 34 32 Z" fill="#FFFFFF" />
    
    <!-- Question Text -->
    <text x="50" y="28" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      What is Spheno Voice AI?
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- FLOATING REAL-TIME AI RESPONSE BADGE (LEFT SIDE)          -->
  <!-- ========================================================= -->
  <g transform="translate(45, 60)">
    <rect width="250" height="64" rx="16" fill="#071032" fill-opacity="0.9" stroke="#1D368C" stroke-width="1" />
    
    <g transform="translate(18, 16)">
      <circle cx="5" cy="5" r="4" fill="#00F2FE" />
      <text x="16" y="9" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SPHENO VOICE AGENT</text>
      <text x="175" y="9" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">380ms</text>
      
      <text x="0" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
        "I can book Dr. Bennett for you at 3:15 PM."
      </text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM AUDIO WAVEFORM FREQUENCY BARS                      -->
  <!-- ========================================================= -->
  <g transform="translate(230, 470)">
    <rect x="-30" y="-12" width="400" height="38" rx="19" fill="#070D28" stroke="#1A2966" stroke-width="1" />
    
    <!-- Real-time Voice Wave Stream -->
    <g transform="translate(15, 7)">
      <rect x="0" y="-4" width="3" height="8" rx="1.5" fill="#0070F3" />
      <rect x="8" y="-8" width="3" height="16" rx="1.5" fill="#00F2FE" />
      <rect x="16" y="-14" width="3" height="28" rx="1.5" fill="#00F2FE" />
      <rect x="24" y="-9" width="3" height="18" rx="1.5" fill="#38BDF8" />
      <rect x="32" y="-4" width="3" height="8" rx="1.5" fill="#0070F3" />
      <rect x="40" y="-12" width="3" height="24" rx="1.5" fill="#00F2FE" />
      <rect x="48" y="-18" width="3" height="36" rx="1.5" fill="#00F2FE" />
      <rect x="56" y="-10" width="3" height="20" rx="1.5" fill="#38BDF8" />
      <rect x="64" y="-5" width="3" height="10" rx="1.5" fill="#0070F3" />
      <rect x="72" y="-13" width="3" height="26" rx="1.5" fill="#00F2FE" />
      <rect x="80" y="-19" width="3" height="38" rx="1.5" fill="#00F2FE" />
      <rect x="88" y="-11" width="3" height="22" rx="1.5" fill="#38BDF8" />
      <rect x="96" y="-5" width="3" height="10" rx="1.5" fill="#0070F3" />
      <rect x="104" y="-14" width="3" height="28" rx="1.5" fill="#00F2FE" />
      <rect x="112" y="-21" width="3" height="42" rx="1.5" fill="#00F2FE" />
      <rect x="120" y="-12" width="3" height="24" rx="1.5" fill="#38BDF8" />
      <rect x="128" y="-6" width="3" height="12" rx="1.5" fill="#0070F3" />
      <rect x="136" y="-13" width="3" height="26" rx="1.5" fill="#00F2FE" />
      <rect x="144" y="-17" width="3" height="34" rx="1.5" fill="#00F2FE" />
      <rect x="152" y="-9" width="3" height="18" rx="1.5" fill="#38BDF8" />
      <rect x="160" y="-5" width="3" height="10" rx="1.5" fill="#0070F3" />
      <rect x="168" y="-14" width="3" height="28" rx="1.5" fill="#00F2FE" />
      <rect x="176" y="-19" width="3" height="38" rx="1.5" fill="#00F2FE" />
      <rect x="184" y="-11" width="3" height="22" rx="1.5" fill="#38BDF8" />
      <rect x="192" y="-5" width="3" height="10" rx="1.5" fill="#0070F3" />
      <rect x="200" y="-13" width="3" height="26" rx="1.5" fill="#00F2FE" />
      <rect x="208" y="-18" width="3" height="36" rx="1.5" fill="#00F2FE" />
      <rect x="216" y="-10" width="3" height="20" rx="1.5" fill="#38BDF8" />
      <rect x="224" y="-5" width="3" height="10" rx="1.5" fill="#0070F3" />
      <rect x="232" y="-12" width="3" height="24" rx="1.5" fill="#00F2FE" />
      <rect x="240" y="-17" width="3" height="34" rx="1.5" fill="#00F2FE" />
      <rect x="248" y="-9" width="3" height="18" rx="1.5" fill="#38BDF8" />
      <rect x="256" y="-4" width="3" height="8" rx="1.5" fill="#0070F3" />
      <rect x="264" y="-11" width="3" height="22" rx="1.5" fill="#00F2FE" />
      <rect x="272" y="-16" width="3" height="32" rx="1.5" fill="#00F2FE" />
      <rect x="280" y="-8" width="3" height="16" rx="1.5" fill="#38BDF8" />
      <rect x="288" y="-4" width="3" height="8" rx="1.5" fill="#0070F3" />
    </g>

    <!-- Live indicator -->
    <text x="320" y="11" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">LIVE AUDIO</text>
  </g>

