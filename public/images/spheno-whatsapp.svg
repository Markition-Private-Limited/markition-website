<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgWaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050827" />
      <stop offset="50%" stop-color="#080D35" />
      <stop offset="100%" stop-color="#03061A" />
    </linearGradient>
    <linearGradient id="cardWaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081432" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050C22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="waAiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2D24" />
      <stop offset="100%" stop-color="#08201A" />
    </linearGradient>
    <linearGradient id="waUserBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgWaGrad)" stroke="#1F2A66" stroke-width="1.5" />

  <!-- WhatsApp Phone Shell Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="url(#cardWaGrad)" stroke="#16382F" stroke-width="1.2" />

    <!-- WhatsApp Header -->
    <rect width="680" height="54" rx="16" fill="#0A221C" />
    <rect y="42" width="680" height="12" fill="#0A221C" />
    <line x1="0" y1="54" x2="680" y2="54" stroke="#124035" stroke-width="1" />

    <!-- Profile Icon + Verified Badge -->
    <g transform="translate(25, 16)">
      <circle cx="12" cy="12" r="12" fill="#25D366" />
      <!-- WA icon mark -->
      <path d="M7 11 L10 14 L17 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="12" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Spheno Automated WhatsApp AI</text>
      <circle cx="230" cy="8" r="5" fill="#25D366" />
      <text x="242" y="12" fill="#25D366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">OFFICIAL VERIFIED API</text>
      <text x="32" y="24" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Automated Re-engagement Engine · Instant Response</text>
    </g>

    <!-- Message 1: AI Triggered (Left) -->
    <g transform="translate(30, 75)">
      <rect width="480" height="74" rx="12" fill="url(#waAiBubble)" stroke="#1C5E4C" stroke-width="1" />
      <text x="16" y="22" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SPHENO AI (Auto Re-engagement):</text>
      <text x="16" y="40" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">"Hi Marcus! We noticed you explored dental implant options</text>
      <text x="16" y="58" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">earlier. Would you like to reserve our last opening this Friday?"</text>
      <text x="420" y="66" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">10:00 AM ✓✓</text>
    </g>

    <!-- Message 2: Customer Reply (Right) -->
    <g transform="translate(320, 165)">
      <rect width="330" height="52" rx="12" fill="url(#waUserBubble)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">"Yes please, Friday at 2:00 PM works!"</text>
      <text x="270" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">10:02 AM</text>
    </g>

    <!-- Message 3: AI Instant Confirmation with Interactive Action Cards (Left) -->
    <g transform="translate(30, 232)">
      <rect width="520" height="105" rx="12" fill="url(#waAiBubble)" stroke="#25D366" stroke-width="1.2" />
      <text x="16" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Booking Confirmed: Friday, Oct 3rd @ 2:00 PM</text>
      <text x="16" y="42" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Dr. Bennett · Private Consultation &amp; 3D Imaging</text>
      
      <!-- Action Buttons -->
      <g transform="translate(16, 56)">
        <rect width="180" height="32" rx="8" fill="#124A3A" stroke="#25D366" stroke-width="1" />
        <text x="22" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📅 Add to Apple/Google</text>

        <rect x="195" width="180" height="32" rx="8" fill="#0A3026" stroke="#1D6650" stroke-width="1" />
        <text x="210" y="21" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📍 Directions &amp; Parking</text>
      </g>
    </g>

    <!-- Bottom WA Input Field -->
    <g transform="translate(30, 356)">
      <rect width="620" height="36" rx="18" fill="#071714" stroke="#143D32" stroke-width="1" />
      <text x="20" y="23" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Type a message...</text>
      <circle cx="598" cy="18" r="12" fill="#25D366" />
      <!-- Mic icon -->
      <rect x="595" y="11" width="6" height="10" rx="3" fill="#FFFFFF" />
      <path d="M593 16 A5 5 0 0 0 603 16" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

  </g>
</svg>
