<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="chatOuterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050827" />
      <stop offset="50%" stop-color="#080E38" />
      <stop offset="100%" stop-color="#03051A" />
    </linearGradient>

    <!-- Card Background (Frosted Glass luxury) -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1648" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060C2A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Chat App Shell (White / High Contrast Luxury as in Image 1) -->
    <linearGradient id="chatAppBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1442" />
      <stop offset="100%" stop-color="#050A24" />
    </linearGradient>

    <!-- Floating Highlight Message Pill (Vibrant Royal Sapphire to Electric Cyan) -->
    <linearGradient id="floatingPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0018C5" />
      <stop offset="50%" stop-color="#0060E6" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Cyan Ambient Halo Glow -->
    <radialGradient id="cyanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0070F3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0018C5" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Deep Glow Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="pillGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.45" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="800" height="520" rx="24" fill="url(#chatOuterBg)" stroke="#1F2A66" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glowing Spheres -->
  <circle cx="680" cy="140" r="180" fill="url(#cyanHalo)" />
  <circle cx="160" cy="400" r="160" fill="url(#cyanHalo)" opacity="0.6" />

  <!-- ========================================================= -->
  <!-- MAIN DISPLAY CARD (MATCHING REFERENCE IMAGE 1 COMPOSITION)-->
  <!-- "Welcome Message / Make a great first impression"         -->
  <!-- ========================================================= -->
  <g transform="translate(60, 40)">
    
    <!-- Outer Card Container -->
    <rect width="680" height="440" rx="20" fill="url(#cardSurface)" stroke="#1E2E72" stroke-width="1.2" filter="url(#cardShadow)" />

    <!-- Top Left Text Section (Exact match to Reference Image 1) -->
    <g transform="translate(48, 52)">
      <!-- Eyebrow Pill Tag -->
      <rect width="130" height="24" rx="12" fill="#0018C5" fill-opacity="0.3" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
      <text x="65" y="16" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
        SPHENO CHAT
      </text>

      <!-- Main Headline from Image 1 -->
      <text x="0" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        Welcome Message
      </text>

      <!-- Subtitle from Image 1 -->
      <text x="0" y="88" fill="#9EA6CA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
        Make a great first impression
      </text>

      <!-- Key Benefits List -->
      <g transform="translate(0, 130)">
        <!-- Bullet 1 -->
        <circle cx="6" cy="6" r="4" fill="#00F2FE" />
        <text x="20" y="10" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          Autonomous 24/7 web concierge
        </text>

        <!-- Bullet 2 -->
        <g transform="translate(0, 32)">
          <circle cx="6" cy="6" r="4" fill="#0070F3" />
          <text x="20" y="10" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
            Instant qualification &amp; slot booking
          </text>
        </g>

        <!-- Bullet 3 -->
        <g transform="translate(0, 64)">
          <circle cx="6" cy="6" r="4" fill="#10B981" />
          <text x="20" y="10" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
            0.28s sub-second latency
          </text>
        </g>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- SLANTED / LAYERED CHAT AGENT WIDGET (RIGHT SIDE)          -->
    <!-- Matching Reference Image 1 with Floating Highlight Pill   -->
    <!-- ========================================================= -->
    <g transform="translate(290, 36)">
      
      <!-- Chat Widget Shell (Layer 1) -->
      <rect width="360" height="375" rx="16" fill="url(#chatAppBg)" stroke="#1C2E75" stroke-width="1.2" />

      <!-- Chat Top Header Bar -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 344 0 C 352.84 0 360 7.16 360 16 L 360 54 L 0 54 Z" fill="#080E2E" />
      <line x1="0" y1="54" x2="360" y2="54" stroke="#16255E" stroke-width="1" />

      <!-- Avatar in Header (Matching Cyber AI Bot) -->
      <g transform="translate(20, 14)">
        <circle cx="14" cy="14" r="14" fill="#0018C5" stroke="#00F2FE" stroke-width="1.2" />
        <!-- Head Silhouette -->
        <circle cx="14" cy="11" r="6" fill="#8BB4F8" />
        <path d="M 6 24 C 6 18 22 18 22 24 Z" fill="#8BB4F8" />
        
        <!-- Header Text -->
        <text x="38" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
          Chat Agent
        </text>
        <circle cx="120" cy="10" r="3.5" fill="#10B981" />
        <text x="128" y="13" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">
          Online
        </text>
      </g>

      <!-- Timestamp -->
      <text x="180" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
        Wed 8:21 AM
      </text>

      <!-- Standard In-Chat Message 1 (Lower Layer) -->
      <g transform="translate(24, 185)">
        <!-- Tag Pill: "Welcome Message" -->
        <rect width="115" height="18" rx="4" fill="#060C26" stroke="#1C2E72" stroke-width="0.8" />
        <text x="10" y="13" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">
          Welcome Message
        </text>

        <!-- Message Body -->
        <g transform="translate(0, 26)">
          <rect width="310" height="52" rx="12" fill="#08123A" stroke="#1A2D70" stroke-width="1" />
          <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
            Hello, I&apos;m your Spheno business concierge.
          </text>
          <text x="14" y="38" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
            How can I help automate your workflow today?
          </text>
        </g>
      </g>

      <!-- Bottom Input Field (Matching Image 1) -->
      <g transform="translate(18, 320)">
        <rect width="324" height="42" rx="12" fill="#060D2A" stroke="#1D2E70" stroke-width="1" />
        <text x="16" y="26" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
          Type your message here...
        </text>
        
        <!-- Send Arrow Icon (Matching Image 1) -->
        <g transform="translate(290, 12)">
          <circle cx="10" cy="10" r="12" fill="#0070F3" />
          <!-- Paper plane send icon -->
          <path d="M 6 10 L 14 6 L 11 14 L 9 11 Z" fill="#FFFFFF" />
        </g>
      </g>

      <!-- ========================================================= -->
      <!-- PROMINENT FLOATING MESSAGE PILL (EXACT HERO ELEMENT)       -->
      <!-- Floating out of the card with glowing drop shadow         -->
      <!-- ========================================================= -->
      <g transform="translate(-55, 96)" filter="url(#pillGlow)">
        
        <!-- Glowing Gradient Pill Background -->
        <rect width="380" height="66" rx="20" fill="url(#floatingPillGrad)" />
        
        <!-- 3D AI Cybernetic Bot Avatar in Pill (Exact match to Image 1) -->
        <g transform="translate(16, 13)">
          <circle cx="20" cy="20" r="20" fill="#040924" stroke="#FFFFFF" stroke-width="1.5" />
          <!-- Sculpted Bot Head Graphic inside Avatar -->
          <ellipse cx="20" cy="18" r="9" rx="8" ry="11" fill="#E0EFFF" />
          <circle cx="17.5" cy="17" r="1.8" fill="#0018C5" />
          <circle cx="22.5" cy="17" r="1.8" fill="#0018C5" />
          <!-- Cyan HUD glint -->
          <circle cx="17" cy="16.5" r="0.7" fill="#00F2FE" />
          <circle cx="22" cy="16.5" r="0.7" fill="#00F2FE" />
          <!-- Smile curve -->
          <path d="M 18 24 Q 20 25.5 22 24" fill="none" stroke="#0018C5" stroke-width="1.2" stroke-linecap="round" />
          <!-- Neck cyber lines -->
          <path d="M 16 28 L 16 34" stroke="#00F2FE" stroke-width="0.8" />
          <path d="M 20 29 L 20 35" stroke="#00F2FE" stroke-width="0.8" />
          <path d="M 24 28 L 24 34" stroke="#00F2FE" stroke-width="0.8" />
        </g>

        <!-- Message Text inside Floating Pill -->
        <text x="68" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
          Hello, I&apos;m your Spheno AI concierge.
        </text>
        <text x="68" y="48" fill="#E0F7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
          How can I help you book or qualify today?
        </text>

        <!-- Edit / Sparkle Action Pill Button on the Right (from Image 1) -->
        <g transform="translate(328, 17)">
          <circle cx="16" cy="16" r="16" fill="#04071E" fill-opacity="0.85" />
          <!-- Sparkle / Edit Icon -->
          <path d="M 16 8 L 18 14 L 24 16 L 18 18 L 16 24 L 14 18 L 8 16 L 14 14 Z" fill="#00F2FE" />
        </g>
      </g>

    </g>

  </g>
</svg>
