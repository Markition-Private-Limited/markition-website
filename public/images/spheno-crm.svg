<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCrmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050827" />
      <stop offset="50%" stop-color="#080D35" />
      <stop offset="100%" stop-color="#03061A" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0018C5" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="crmCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1340" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060B28" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgCrmGrad)" stroke="#1F2A66" stroke-width="1.5" />

  <!-- Main CRM Mockup Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="url(#crmCardGrad)" stroke="#1E2A68" stroke-width="1.2" />

    <!-- Top CRM Header Bar -->
    <rect width="680" height="52" rx="16" fill="#0D1648" />
    <rect y="40" width="680" height="12" fill="#0D1648" />
    <line x1="0" y1="52" x2="680" y2="52" stroke="#1A255C" stroke-width="1" />

    <g transform="translate(25, 20)">
      <circle cx="6" cy="6" r="6" fill="#0070F3" />
      <text x="20" y="10" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Spheno Unified Intelligence CRM</text>
      <text x="240" y="10" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">● 100% Attribution Ingestion Active</text>
    </g>

    <g transform="translate(540, 16)">
      <rect width="115" height="24" rx="6" fill="#1E2A68" />
      <text x="12" y="16" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Real-Time Sync</text>
    </g>

    <!-- 3 KPI Metric Cards -->
    <g transform="translate(25, 68)">
      <!-- KPI 1 -->
      <g transform="translate(0, 0)">
        <rect width="195" height="68" rx="10" fill="#070E32" stroke="#1C2860" stroke-width="1" />
        <text x="14" y="22" fill="#8B98D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">INBOUND PIPELINE</text>
        <text x="14" y="48" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">$348,500</text>
        <text x="120" y="48" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">+34.2%</text>
      </g>

      <!-- KPI 2 -->
      <g transform="translate(215, 0)">
        <rect width="195" height="68" rx="10" fill="#070E32" stroke="#1C2860" stroke-width="1" />
        <text x="14" y="22" fill="#8B98D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">QUALIFIED LEADS</text>
        <text x="14" y="48" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">1,482</text>
        <text x="120" y="48" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">94.8% Viable</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(430, 0)">
        <rect width="200" height="68" rx="10" fill="#070E32" stroke="#1C2860" stroke-width="1" />
        <text x="14" y="22" fill="#8B98D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">AFTER-HOURS BOOKINGS</text>
        <text x="14" y="48" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">624</text>
        <text x="95" y="48" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Zero Human Delay</text>
      </g>
    </g>

    <!-- Main Lead Growth Chart (Matching Reference Image 3) -->
    <g transform="translate(25, 150)">
      <rect width="630" height="185" rx="12" fill="#060C2C" stroke="#192764" stroke-width="1" />

      <!-- Chart Header -->
      <text x="20" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Lead Generation Performance</text>
      <text x="20" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Multi-Channel AI Acquisition (Last 30 Days)</text>

      <!-- Grid lines -->
      <line x1="60" y1="65" x2="600" y2="65" stroke="#101C48" stroke-width="1" />
      <line x1="60" y1="105" x2="600" y2="105" stroke="#101C48" stroke-width="1" />
      <line x1="60" y1="145" x2="600" y2="145" stroke="#101C48" stroke-width="1" />

      <!-- Y axis labels -->
      <text x="48" y="70" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">40K</text>
      <text x="48" y="110" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">20K</text>
      <text x="48" y="150" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">0K</text>

      <!-- Shaded Area Chart Path -->
      <path d="M 60 145 L 85 130 L 115 135 L 145 110 L 180 125 L 220 95 L 260 115 L 300 80 L 340 100 L 380 65 L 420 85 L 470 50 L 520 60 L 560 45 L 600 38 L 600 155 L 60 155 Z" fill="url(#chartAreaGrad)" />

      <!-- Glowing Cyan Stroke Curve -->
      <path d="M 60 145 L 85 130 L 115 135 L 145 110 L 180 125 L 220 95 L 260 115 L 300 80 L 340 100 L 380 65 L 420 85 L 470 50 L 520 60 L 560 45 L 600 38" fill="none" stroke="#00F2FE" stroke-width="2.5" />

      <!-- Data Point Highlight -->
      <circle cx="600" cy="38" r="5" fill="#00F2FE" />
      <circle cx="600" cy="38" r="9" fill="#00F2FE" opacity="0.3" />
      <rect x="530" y="16" width="70" height="18" rx="4" fill="#0070F3" />
      <text x="565" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+148% MoM</text>

      <!-- X Axis Dates -->
      <text x="85" y="172" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sep 01</text>
      <text x="180" y="172" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sep 08</text>
      <text x="300" y="172" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sep 16</text>
      <text x="420" y="172" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sep 24</text>
      <text x="560" y="172" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sep 30</text>
