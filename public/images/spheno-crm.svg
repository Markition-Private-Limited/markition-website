    <!-- Bottom Customer Profile Ingestion Pill -->
    <g transform="translate(25, 348)">
      <rect width="630" height="42" rx="10" fill="#091338" stroke="#1D2A65" stroke-width="1" />
      <circle cx="24" cy="21" r="10" fill="#0070F3" />
      <text x="20" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">MV</text>
      <text x="44" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Marcus Vance · High Intent Implant Assessment</text>
      <text x="450" y="25" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ Booked for Oct 2nd · Value: $4,200</text>
    </g>

  </g>
</svg>
