<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%">
  <defs>
    <!-- Light Theme Surface Gradients -->
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Floating Pill Gradient (Spheno Sapphire to Cyan) -->
    <linearGradient id="pillGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0018C5" />
      <stop offset="55%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FE" />
    </linearGradient>

    <!-- High-end Drop Shadows -->
    <filter id="lightDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <filter id="pillGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.36" />
    </filter>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="840" height="520" rx="24" fill="url(#bgLightGrad)" stroke="#CBD5E1" stroke-width="1.2" />
  
  <!-- Subtle Soft Azure & Cyan Ambient Bloom -->
  <circle cx="720" cy="100" r="180" fill="#00D2FE" opacity="0.10" />
  <circle cx="120" cy="420" r="150" fill="#0018C5" opacity="0.06" />

  <!-- ========================================================= -->
  <!-- MAIN CONTAINER WITH PROPER BREATHING ROOM (NO CUTOFFS)    -->
  <!-- ========================================================= -->
  <g transform="translate(40, 40)">
    
    <!-- White Card Surface -->
    <rect width="760" height="440" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#lightDropShadow)" />

    <!-- Left Content Column (Ample 300px space) -->
    <g transform="translate(40, 48)">
      <!-- Eyebrow Badge -->
      <rect width="130" height="26" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#0018C5" />
      <text x="74" y="17" fill="#0018C5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
        SPHENO CHAT
      </text>

      <!-- Welcome Message Title (Fully visible, completely unobstructed) -->
      <text x="0" y="66" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
        Welcome Message
      </text>

      <!-- Subtitle -->
      <text x="0" y="94" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
        Make a great first impression
      </text>

      <!-- Bullet Checklist -->
      <g transform="translate(0, 136)">
        <!-- Bullet 1 -->
        <circle cx="8" cy="8" r="7" fill="#E0F2FE" />
        <circle cx="8" cy="8" r="3.5" fill="#0284C7" />
        <text x="24" y="12" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
          Autonomous 24/7 web concierge
        </text>

        <!-- Bullet 2 -->
        <g transform="translate(0, 36)">
          <circle cx="8" cy="8" r="7" fill="#EFF6FF" />
          <circle cx="8" cy="8" r="3.5" fill="#2563EB" />
          <text x="24" y="12" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
            Instant qualification &amp; slot booking
          </text>
        </g>

        <!-- Bullet 3 -->
        <g transform="translate(0, 72)">
          <circle cx="8" cy="8" r="7" fill="#ECFDF5" />
          <circle cx="8" cy="8" r="3.5" fill="#059669" />
          <text x="24" y="12" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
            0.28s sub-second latency
          </text>
        </g>
      </g>
    </g>

    <!-- ========================================================= -->
    <!-- REALISTIC CHAT WIDGET (RIGHT SIDE)                        -->
    <!-- Positioned cleanly at X=380 so it never overlaps left text-->
    <!-- ========================================================= -->
    <g transform="translate(370, 32)">
      
      <!-- Chat Widget White Shell -->
      <rect width="350" height="375" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#lightDropShadow)" />

      <!-- Top Bar: Dark Modern Header -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 334 0 C 342.84 0 350 7.16 350 16 L 350 56 L 0 56 Z" fill="#0F172A" />

      <!-- Avatar & Name in Top Bar -->
      <g transform="translate(18, 12)">
        <!-- Realistic AI Agent Ring Badge -->
        <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="#00D2FE" stroke-width="1.5" />
        <circle cx="16" cy="16" r="11" fill="#0018C5" />
        <circle cx="16" cy="16" r="6" fill="#00F2FE" />
        
        <text x="40" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
          Chat Agent
        </text>
        <circle cx="120" cy="12" r="3.5" fill="#10B981" />
        <text x="128" y="15" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">
          Active Now
        </text>
      </g>

      <!-- Timestamp -->
      <text x="175" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">
        Wed 8:21 AM
      </text>

      <!-- In-Chat Message Body -->
      <g transform="translate(20, 185)">
        <!-- Tag: "Welcome Message" -->
        <rect width="112" height="18" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8" />
        <text x="10" y="13" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">
          Welcome Message
        </text>

        <!-- Message Bubble -->
        <g transform="translate(0, 24)">
          <rect width="310" height="52" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
          <text x="14" y="20" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
            Hello, I&apos;m your Spheno business concierge.
          </text>
          <text x="14" y="38" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
            How can I help automate your workflow today?
          </text>
        </g>
      </g>

      <!-- Bottom Light Input Field -->
      <g transform="translate(18, 318)">
        <rect width="314" height="42" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
          Type your message here...
        </text>
        
        <!-- Blue Send Button with Airplane Icon -->
        <g transform="translate(280, 10)">
          <circle cx="11" cy="11" r="12" fill="#0066FF" />
          <path d="M 7 11 L 15 7 L 12 15 L 10 12 Z" fill="#FFFFFF" />
        </g>
      </g>

      <!-- ========================================================= -->
      <!-- PROMINENT FLOATING MESSAGE PILL (CLEAN REALISTIC 3D GLOW) -->
      <!-- ========================================================= -->
      <g transform="translate(-40, 96)" filter="url(#pillGlowLight)">
        
        <!-- Glowing Pill Container -->
        <rect width="365" height="64" rx="18" fill="url(#pillGradLight)" />
        
        <!-- Realistic AI Cyber Bot Orb (No cartoon face!) -->
        <g transform="translate(14, 12)">
          <circle cx="20" cy="20" r="20" fill="#040924" stroke="#FFFFFF" stroke-width="1.5" />
          <circle cx="20" cy="20" r="15" fill="#0018C5" />
          <circle cx="20" cy="20" r="10" fill="#00D2FE" />
          <circle cx="20" cy="20" r="5" fill="#FFFFFF" />
        </g>

        <!-- Message Text inside Floating Pill -->
        <text x="64" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
          Hello, I&apos;m your Spheno AI concierge.
        </text>
        <text x="64" y="45" fill="#E0F7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
          How can I help you book or qualify today?
        </text>

        <!-- Edit Icon Pill -->
        <g transform="translate(322, 16)">
          <circle cx="16" cy="16" r="15" fill="#0F172A" />
          <path d="M 12 20 L 19 13 L 20 14 L 13 21 Z M 19 11 L 21 13 Z" fill="#00F2FE" />
        </g>
      </g>

    </g>

  </g>
</svg>
