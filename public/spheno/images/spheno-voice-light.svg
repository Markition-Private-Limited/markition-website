    <!-- Live indicator -->
    <text x="315" y="13" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">LIVE AUDIO</text>
