      <!-- Pupil -->
      <circle cx="0" cy="-2" r="4.5" fill="#0A0F29" />
      <!-- Specular Highlight -->
      <circle cx="-2.5" cy="-4.5" r="2.2" fill="#FFFFFF" />
      <circle cx="3" cy="2" r="1" fill="#FFFFFF" />
      <!-- Upper Eyelid Rim -->
      <path d="M -24 -2 C -12 -11 12 -11 24 -2" fill="none" stroke="#0F172A" stroke-width="1.8" />
    </g>

    <!-- Right Eyebrow & Orbit -->
    <g transform="translate(40, -44)">
      <!-- Eyebrow -->
      <path d="M -25 -14 C -14 -20 10 -22 22 -14" fill="none" stroke="#172554" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -23 -13 C -12 -19 10 -20 20 -13" fill="none" stroke="#BFDBFE" stroke-width="0.8" opacity="0.7" />
      <!-- Sclera -->
