      <!-- Iris -->
      <circle cx="0" cy="-2" r="10" fill="url(#irisGradLight)" />
      <!-- Pupil -->
      <circle cx="0" cy="-2" r="4.5" fill="#0A0F29" />
      <!-- Specular Highlight -->
      <circle cx="-2.5" cy="-4.5" r="2.2" fill="#FFFFFF" />
      <circle cx="3" cy="2" r="1" fill="#FFFFFF" />
      <!-- Upper Eyelid Rim -->
      <path d="M -24 -2 C -12 -11 12 -11 24 -2" fill="none" stroke="#0F172A" stroke-width="1.8" />
    </g>

    <!-- Slender Sculpted Nose -->
    <path d="M 0 -40 L -4 10 L 0 16 L 4 10 Z" fill="#93C5FD" opacity="0.5" />
    <circle cx="0" cy="14" r="3.5" fill="#FFFFFF" opacity="0.8" />
    <path d="M -8 16 C -4 18 4 18 8 16" fill="none" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round" />

    <!-- Sculpted Lips (Natural Form from Image) -->
    <g transform="translate(0, 48)">
      <path d="M -18 0 C -10 -4 0 -2 0 -2 C 0 -2 10 -4 18 0 C 10 4 0 5 0 5 C 0 5 -10 4 -18 0 Z" fill="#3B5998" />
      <path d="M -15 3 C -7 10 7 10 15 3 C 7 5 -7 5 -15 3 Z" fill="#6889E8" />
      <line x1="-16" y1="1" x2="16" y2="1" stroke="#101C4E" stroke-width="1.2" />
      <!-- Highlight -->
      <ellipse cx="0" cy="6" rx="6" ry="2" fill="#E0EDFF" opacity="0.7" />
    </g>

    <!-- Chin Specular -->
    <circle cx="0" cy="80" r="7" fill="#E0EDFF" opacity="0.4" />
  </g>

