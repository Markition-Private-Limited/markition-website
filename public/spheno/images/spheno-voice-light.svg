    <circle cx="24" cy="20" r="5" fill="#2563EB" />
    <path d="M 15 30 C 15 25 33 25 33 30 Z" fill="#2563EB" />
    
    <text x="50" y="29" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
      What is Spheno Voice AI?
    </text>
  </g>

  <!-- Top Left: Spheno Voice Agent Dialogue Badge -->
  <g transform="translate(48, 52)" filter="url(#voiceCardShadow)">
    <rect width="260" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <g transform="translate(18, 16)">
      <circle cx="5" cy="5" r="4" fill="#0284C7" />
      <text x="16" y="9" fill="#0369A1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SPHENO VOICE AGENT</text>
      <text x="180" y="9" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">380ms</text>
      
      <text x="0" y="32" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        &quot;I can book Dr. Bennett for you at 3:15 PM.&quot;
      </text>
    </g>
  </g>

  <!-- Bottom Frequency Waveform Stream -->
