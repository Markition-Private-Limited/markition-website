      <path d="M -22 -14 C -10 -22 14 -20 25 -14" fill="none" stroke="#172554" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -20 -13 C -10 -20 12 -19 23 -13" fill="none" stroke="#BFDBFE" stroke-width="0.8" opacity="0.7" />
      <!-- Sclera -->
