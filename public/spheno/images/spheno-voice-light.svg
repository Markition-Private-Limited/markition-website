<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Light Studio Background -->
    <linearGradient id="voiceLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>

    <!-- 3D Face Shading Gradients matching User's Uploaded Avatar -->
    <radialGradient id="faceShadingLight" cx="50%" cy="36%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#CFE0FC" />
      <stop offset="55%" stop-color="#7B9FF0" />
      <stop offset="78%" stop-color="#3D64CC" />
      <stop offset="94%" stop-color="#1E3994" />
      <stop offset="100%" stop-color="#102268" />
    </radialGradient>

    <linearGradient id="neckShadingLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D64CC" />
      <stop offset="35%" stop-color="#2342A6" />
      <stop offset="75%" stop-color="#142B75" />
      <stop offset="100%" stop-color="#0B1A4D" />
    </linearGradient>

    <radialGradient id="irisGradLight" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00D2FE" />
      <stop offset="70%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#081444" />
    </radialGradient>

    <!-- Clean Light Drop Shadows -->
    <filter id="voiceCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Light Studio Canvas -->
  <rect width="800" height="520" rx="20" fill="url(#voiceLightBg)" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Soft Azure Studio Halo behind Avatar -->
  <circle cx="400" cy="270" r="210" fill="#00D2FE" opacity="0.12" />
  <circle cx="400" cy="260" r="140" fill="#0066FF" opacity="0.08" />

  <!-- Holographic Concentric Sound Wave Rings -->
  <g opacity="0.4">
    <ellipse cx="400" cy="275" rx="250" ry="180" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="6,8" />
    <ellipse cx="400" cy="275" rx="210" ry="150" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4,6" />
  </g>

  <!-- ========================================================= -->
  <!-- EXACT 3D CYBERNETIC AI BOT AVATAR (HUMANOID SCULPTED HEAD)-->
  <!-- Matching User's Uploaded Avatar Image with Precision      -->
  <!-- ========================================================= -->
  <g id="avatarBust" transform="translate(400, 280)">
    
    <!-- Shoulders & Upper Chest Base -->
    <path d="M -175 240 C -155 145 -85 125 -52 95 L 52 95 C 85 125 155 145 175 240 Z" fill="url(#neckShadingLight)" />

    <!-- Delicate Fiber Strands on Shoulders (White/Cyan Lines) -->
    <g stroke="#E0EDFF" stroke-width="0.8" opacity="0.75">
      <path d="M -155 240 C -135 165 -80 145 -42 105" fill="none" />
      <path d="M -130 240 C -110 175 -70 150 -32 110" fill="none" />
      <path d="M -105 240 C -85 185 -55 155 -22 115" fill="none" />
      <path d="M -80 240 C -60 195 -35 160 -12 120" fill="none" />
      <path d="M 155 240 C 135 165 80 145 42 105" fill="none" />
      <path d="M 130 240 C 110 175 70 150 32 110" fill="none" />
      <path d="M 105 240 C 85 185 55 155 22 115" fill="none" />
      <path d="M 80 240 C 60 195 35 160 12 120" fill="none" />
    </g>

    <!-- Neck Structure -->
    <path d="M -48 30 C -47 65 -50 100 -52 115 L 52 115 C 50 100 47 65 48 30 Z" fill="url(#neckShadingLight)" />
    
    <!-- Neck Synthetic Fiber Strands (Topographic Contours) -->
    <g stroke="#BAE6FD" stroke-width="0.75" opacity="0.85">
      <path d="M -40 35 C -37 65 -38 95 -40 115" fill="none" />
      <path d="M -28 40 C -26 68 -26 95 -28 115" fill="none" />
      <path d="M -16 45 C -14 70 -14 95 -16 115" fill="none" />
      <path d="M 0 45 L 0 115" fill="none" />
      <path d="M 16 45 C 14 70 14 95 16 115" fill="none" />
      <path d="M 28 40 C 26 68 26 95 28 115" fill="none" />
      <path d="M 40 35 C 37 65 38 95 40 115" fill="none" />
    </g>

    <!-- Head & Skull Base Silhouette (Exact Proportions of User Image) -->
    <path d="M 0 -185 
             C 82 -185 104 -132 104 -62 
             C 104 8 74 58 48 84 
             C 32 99 18 106 0 107 
             C -18 106 -32 99 -48 84 
             C -74 58 -104 8 -104 -62 
             C -104 -132 -82 -185 0 -185 Z" 
          fill="url(#faceShadingLight)" 
          stroke="#0284C7" 
          stroke-width="1" 
          stroke-opacity="0.3" />

    <!-- Topographic Neural Lines across Cranium & Forehead (Signature from Image) -->
    <g stroke="#FFFFFF" stroke-width="0.7" opacity="0.45" fill="none">
      <path d="M -60 -170 C -30 -180 30 -180 60 -170" />
      <path d="M -72 -155 C -35 -170 35 -170 72 -155" />
      <path d="M -82 -140 C -40 -158 40 -158 82 -140" />
      <path d="M -90 -125 C -45 -145 45 -145 90 -125" />
      <path d="M -96 -110 C -48 -130 48 -130 96 -110" />
      <path d="M -100 -95 C -50 -115 50 -115 100 -95" />
      <path d="M -102 -80 C -52 -100 52 -100 102 -80" />
    </g>

    <!-- Ears (Realistic Sculpted Ear Cartilage) -->
    <g transform="translate(94, -60)">
      <path d="M 0 -25 C 18 -15 18 35 0 55 C -5 50 -5 -20 0 -25 Z" fill="#2542A6" />
      <path d="M 4 -15 C 12 -8 12 25 2 40" fill="none" stroke="#93C5FD" stroke-width="0.8" opacity="0.6" />
    </g>
    <g transform="translate(-94, -60) scale(-1, 1)">
      <path d="M 0 -25 C 18 -15 18 35 0 55 C -5 50 -5 -20 0 -25 Z" fill="#2542A6" />
      <path d="M 4 -15 C 12 -8 12 25 2 40" fill="none" stroke="#93C5FD" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Left Eyebrow & Orbit -->
